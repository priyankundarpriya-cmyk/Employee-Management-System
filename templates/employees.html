<!DOCTYPE html>
<html>
<head>
    <title>Employee Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Employee Management System</h1>

    <a href="{{ url_for('employees.add_employee') }}">Add Employee</a>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Department</th>
            <th>Designation</th>
            <th>Salary</th>
            <th>Actions</th>
        </tr>

        {% for employee in employees %}
        <tr>
            <td>{{ employee.id }}</td>
            <td>{{ employee.name }}</td>
            <td>{{ employee.email }}</td>
            <td>{{ employee.department }}</td>
            <td>{{ employee.designation }}</td>
            <td>{{ employee.salary }}</td>
            <td>
    <a href="{{ url_for('employees.edit_employee', id=employee.id) }}">Edit</a>

    <form method="POST" action="{{ url_for('employees.delete_employee', id=employee.id) }}">
        <button type="submit" onclick="return confirm('Delete this employee?')">
            Delete
        </button>
    </form>
</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
